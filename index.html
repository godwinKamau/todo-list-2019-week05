<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>To-Do List</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <section class="container">
            <video autoplay muted loop>
                    <source src="assets/8604260-uhd_3840_2160_30fps.mp4" type="video/mp4">
            </video>
            <table id="to-do">
                <thead>
                    <tr>
                        <th scope ="col">Checked</th>
                        <th scope="col">What it is?</th>
                        <th scope="col">Due Date</th>
                        <td><button id="del-task">Delete Checked Items</button></td>
                    </tr>
                </thead>
                <tbody>
                    <tr>

                    </tr>
                    
                </tbody>
                <tfoot>
                    <tr>
                        <td></td>
                        <td><input type="text" id="new-todo" placeholder="Enter task"></td>
                        <td><input type="date" id="new-due"></td>
                        <td><button id="new-task">Add New Task</button></td>
                    </tr>
                </tfoot>
            </table>
        </section>
    <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
